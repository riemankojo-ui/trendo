<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6D3BEA" />
    <meta name="description" content="TRENDO — Your World. Your Trends." />
    <title>TRENDO — Your World. Your Trends.</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (e) {
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<pre style="padding:16px;color:#b00;white-space:pre-wrap;font-size:12px">' +
            (e.message || "Script failed to load") + "</pre>"
        );
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
